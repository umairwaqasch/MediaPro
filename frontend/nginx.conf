server {
    listen 80;
    server_name localhost;

    # Allow large video file uploads
    client_max_body_size 4000M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect root to /videoprocessor/
    location = / {
        return 301 /mediapro/;
    }

    # Reverse proxy API requests to FastAPI backend
    location /mediapro/api/ {
        proxy_pass http://api:8000/mediapro/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE and real-time streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend React SPA under /mediapro/
    location /mediapro/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mediapro/index.html;
        index index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }
}
